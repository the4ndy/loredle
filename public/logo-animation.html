<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loredle — Neo-Brutalist Motion Graphics Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ed;
            --grid-color: rgba(0, 0, 0, 0.07);
            --ink-black: #050505;
            --brand-purple: #9d7bff;
            --brand-purple-deep: #6955a4;
            --brand-teal: #2ce5c6;
            --brand-pink: #ff47ab;
            --brand-gold: #ffd166;
            --shadow-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* Dark Theme Variant */
        body.theme-dark {
            --bg-color: #120d22;
            --grid-color: rgba(255, 255, 255, 0.08);
            --ink-black: #ffffff;
            --shadow-color: #000000;
        }

        /* Mint Theme Variant */
        body.theme-mint {
            --bg-color: #e6faf5;
            --grid-color: rgba(0, 0, 0, 0.06);
            --ink-black: #050505;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 8px;
            padding: 6px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 4px 4px 0px #000000;
            text-transform: uppercase;
        }

        body.theme-dark .brand-pill {
            background: #1e1638;
            color: #ffffff;
            border-color: #000000;
        }

        .back-link {
            text-decoration: none;
            color: #000000;
            background: var(--brand-teal);
            border: 3px solid #000000;
            border-radius: 8px;
            padding: 6px 14px;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        /* Stage Area with 3D Depth */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 820px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        /* 3D Depth Ground Plane / Grid */
        .ground-plane {
            position: absolute;
            bottom: 60px;
            width: 560px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.06) 0%, transparent 70%);
            transform: rotateX(68deg) translateZ(-40px);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        body.theme-dark .ground-plane {
            background: radial-gradient(ellipse at center, rgba(157, 123, 255, 0.12) 0%, transparent 70%);
        }

        /* Ground Contact Shadow (tracks the ball/box in 3D) */
        #ground-shadow {
            position: absolute;
            bottom: 110px;
            width: 60px;
            height: 20px;
            background: rgba(0, 0, 0, 0.38);
            border-radius: 50%;
            filter: blur(4px);
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
            pointer-events: none;
            transition: width 0.08s, height 0.08s, filter 0.08s, opacity 0.08s;
            z-index: 10;
        }

        body.theme-dark #ground-shadow {
            background: rgba(0, 0, 0, 0.7);
        }

        /* Shockwave Rings on Impact */
        .shockwave {
            position: absolute;
            bottom: 110px;
            left: 50%;
            width: 30px;
            height: 12px;
            border: 3.5px solid #000000;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 12;
        }

        /* Sparkle / Dust Particle Container */
        #particles-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            overflow: visible;
        }

        .dust-particle {
            position: absolute;
            background: #000000;
            border-radius: 50%;
            pointer-events: none;
        }

        .cross-spark {
            position: absolute;
            width: 14px;
            height: 14px;
            pointer-events: none;
        }

        .cross-spark::before,
        .cross-spark::after {
            content: '';
            position: absolute;
            background: #000000;
        }

        .cross-spark::before {
            top: 0;
            left: 5px;
            width: 4px;
            height: 14px;
        }

        .cross-spark::after {
            top: 5px;
            left: 0;
            width: 14px;
            height: 4px;
        }

        /* ==========================================================================
           THE HERO ACTOR: DOT -> RECTANGLE -> LOGO BADGE
           ========================================================================== */
        #motion-actor {
            position: absolute;
            bottom: 110px;
            left: 50%;
            width: 54px;
            height: 54px;
            background-color: #000000;
            border: 4px solid #000000;
            border-radius: 50%;
            transform-origin: 50% 100%;
            transform: translate(-50%, 0) translateY(-600px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            box-shadow: 0px 0px 0px transparent;
            overflow: hidden;
            will-change: transform, width, height, border-radius, background-color, box-shadow;
        }

        /* Inner Color Fill Layer */
        #actor-fill {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--brand-purple) 0%, var(--brand-purple-deep) 100%);
            opacity: 0;
            transform: scale(0);
            border-radius: inherit;
            z-index: 1;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Holographic Diagonal Sheen */
        #actor-sheen {
            position: absolute;
            inset: -40px;
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255, 255, 255, 0.45) 45%,
                rgba(44, 229, 198, 0.4) 50%,
                rgba(255, 71, 171, 0.4) 55%,
                transparent 70%
            );
            transform: translateX(-160%);
            z-index: 4;
            pointer-events: none;
        }

        /* Letters Container */
        #letters-container {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            height: 100%;
            padding: 0 16px;
        }

        /* Individual Kinetic Letters */
        .logo-letter {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 3.4rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            opacity: 0;
            transform: translateY(-50px) scale(0.2) rotate(-15deg);
            text-shadow: 3.5px 3.5px 0px #000000;
            -webkit-text-stroke: 1.5px #000000;
            will-change: transform, opacity;
        }

        /* Lorcana Lore Diamond Badge attached to logo */
        #lore-diamond {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 32px;
            height: 32px;
            background: var(--brand-gold);
            border: 3.5px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transform: rotate(45deg) scale(0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
        }

        #lore-diamond::after {
            content: '✦';
            color: #000000;
            font-size: 1.1rem;
            font-weight: 900;
            transform: rotate(-45deg);
            line-height: 1;
        }

        /* Accent Impact Action Lines (Pop on Shadow) */
        .burst-line {
            position: absolute;
            background: #000000;
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
        }

        /* ==========================================================================
           CONTROLS & PLAYBAR (NEO-BRUTALIST TACTILE PANEL)
           ========================================================================== */
        .controls-card {
            width: 100%;
            max-width: 780px;
            background: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 14px;
            box-shadow: 6px 6px 0px #000000;
            padding: 18px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 50;
        }

        body.theme-dark .controls-card {
            background: #1e1638;
            border-color: #000000;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border: 2.5px solid #000000;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            box-shadow: 3.5px 3.5px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        .btn-primary {
            background-color: var(--brand-purple);
            color: #000000;
        }

        .btn-primary:hover {
            background-color: #b59bff;
        }

        .btn-teal {
            background-color: var(--brand-teal);
            color: #000000;
        }

        .btn-pink {
            background-color: var(--brand-pink);
            color: #000000;
        }

        .btn-subtle {
            background-color: #f0ede6;
            color: #000000;
        }

        body.theme-dark .btn-subtle {
            background-color: #2b214a;
            color: #ffffff;
        }

        .btn-toggle.active {
            background-color: var(--brand-teal);
            color: #000000;
        }

        .speed-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 4px 8px;
            background: #ffffff;
            color: #000000;
            cursor: pointer;
        }

        .speed-badge.selected {
            background: #000000;
            color: #ffffff;
        }

        body.theme-dark .speed-badge {
            background: #160e2b;
            color: #ffffff;
        }

        body.theme-dark .speed-badge.selected {
            background: var(--brand-teal);
            color: #000000;
        }

        /* Timeline Step Tracker */
        .step-tracker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            color: #666666;
        }

        body.theme-dark .step-tracker {
            color: #aaaaaa;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cccccc;
            border: 1.5px solid #000000;
            transition: background 0.2s, transform 0.2s;
        }

        .step-dot.active {
            background: var(--brand-pink);
            transform: scale(1.4);
        }

        /* Responsive Mobile Tuning */
        @media (max-width: 600px) {
            .stage-container {
                height: 400px;
            }

            .logo-letter {
                font-size: 2.3rem;
            }

            .controls-card {
                padding: 14px;
                justify-content: center;
            }

            .control-group {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="top-bar">
        <div class="brand-pill">
            <span>✨ Neo-Brutalist Motion Graphics</span>
        </div>
        <a href="index.html" class="back-link">
            <span>← Back to Hub</span>
        </a>
    </header>

    <!-- Main Motion Graphics Stage -->
    <main class="stage-container" id="stage">
        <!-- 3D Ground Perspective Plane -->
        <div class="ground-plane"></div>

        <!-- Contact Ground Shadow -->
        <div id="ground-shadow"></div>

        <!-- Shockwave Ring on Bounce -->
        <div class="shockwave" id="shockwave"></div>

        <!-- Dynamic Particles Container (Dust, Sparks, Rays) -->
        <div id="particles-container"></div>

        <!-- The Hero Actor: Ball -> Box -> Logo -->
        <div id="motion-actor">
            <div id="actor-fill"></div>
            <div id="actor-sheen"></div>
            <div id="letters-container">
                <span class="logo-letter" data-letter="L">L</span>
                <span class="logo-letter" data-letter="O">O</span>
                <span class="logo-letter" data-letter="R">R</span>
                <span class="logo-letter" data-letter="E">E</span>
                <span class="logo-letter" data-letter="D">D</span>
                <span class="logo-letter" data-letter="L">L</span>
                <span class="logo-letter" data-letter="E">E</span>
            </div>
            <div id="lore-diamond"></div>
        </div>
    </main>

    <!-- Bottom Controls & Playbar -->
    <footer class="controls-card">
        <div class="control-group">
            <button class="btn btn-primary" id="btn-replay" onclick="triggerReplay()">
                <span id="replay-icon">↺</span> Replay Animation
            </button>
            <button class="btn btn-subtle" id="btn-sound" onclick="toggleSound()">
                <span id="sound-icon">🔊</span> Sound: ON
            </button>
        </div>

        <div class="control-group">
            <div class="step-tracker">
                <span>PHASE:</span>
                <div class="step-dot" id="dot-1" title="Bounce"></div>
                <div class="step-dot" id="dot-2" title="Morph"></div>
                <div class="step-dot" id="dot-3" title="Color Fill"></div>
                <div class="step-dot" id="dot-4" title="Shadow Pop"></div>
                <div class="step-dot" id="dot-5" title="Letters"></div>
            </div>

            <div style="display: flex; gap: 4px; align-items: center; margin-left: 6px;">
                <span style="font-family: 'Space Mono'; font-size: 0.72rem; margin-right: 4px;">SPEED:</span>
                <button class="speed-badge" onclick="setSpeed(0.5, this)">0.5x</button>
                <button class="speed-badge selected" onclick="setSpeed(1.0, this)">1.0x</button>
                <button class="speed-badge" onclick="setSpeed(1.5, this)">1.5x</button>
            </div>
        </div>

        <div class="control-group">
            <button class="btn btn-subtle" id="btn-theme" onclick="cycleTheme()">
                🌓 Theme: Paper
            </button>
            <a href="game.html" class="btn btn-teal" style="text-decoration: none;">
                ▶ Play Game
            </a>
        </div>
    </footer>

    <!-- ==========================================================================
         SOUND SYNTHESIZER (WEB AUDIO API — 100% SELF-CONTAINED, ZERO ASSETS)
         ========================================================================== -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Punchy Pixar-like rubber ball bounce
            playBounce(pitchMultiplier = 1, volume = 0.35) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                // Rapid frequency drop creates the elastic "boing"
                const startFreq = 260 * pitchMultiplier;
                const endFreq = 65 * pitchMultiplier;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.14);

                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.16);
            }

            // Elastic stretch / morph snap
            playMorph() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.22);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.24);
            }

            // Color fill whoosh
            playColorFill() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.linearRampToValueAtTime(640, now + 0.18);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.28);
            }

            // Hard tactile "THWACK" when shadow snaps out
            playShadowPop() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // Low bass thump
                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(120, now);
                subOsc.frequency.exponentialRampToValueAtTime(40, now + 0.16);

                subGain.gain.setValueAtTime(0.4, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                subOsc.connect(subGain);
                subGain.connect(this.ctx.destination);
                subOsc.start(now);
                subOsc.stop(now + 0.16);

                // Sharp pop transient
                const clickOsc = this.ctx.createOscillator();
                const clickGain = this.ctx.createGain();
                clickOsc.type = 'square';
                clickOsc.frequency.setValueAtTime(800, now);
                clickOsc.frequency.exponentialRampToValueAtTime(100, now + 0.04);

                clickGain.gain.setValueAtTime(0.25, now);
                clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                clickOsc.connect(clickGain);
                clickGain.connect(this.ctx.destination);
                clickOsc.start(now);
                clickOsc.stop(now + 0.04);
            }

            // Letter typewriter stamp
            playLetterStamp(index) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Ascending melodic scale for the 7 letters: L-O-R-E-D-L-E
                const notes = [330, 392, 440, 523, 587, 659, 784];
                const freq = notes[index % notes.length];

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq * 1.3, now);
                osc.frequency.exponentialRampToValueAtTime(freq, now + 0.06);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            }

            // High shimmer bell on lore diamond finish
            playShimmer() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                [1046.5, 1318.5, 1567.98].forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.04);

                    gain.gain.setValueAtTime(0.18, now + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.45);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.04);
                    osc.stop(now + idx * 0.04 + 0.45);
                });
            }
        }

        const sound = new SoundFX();

        function toggleSound() {
            sound.enabled = !sound.enabled;
            const btn = document.getElementById('btn-sound');
            const icon = document.getElementById('sound-icon');
            if (sound.enabled) {
                sound.init();
                btn.innerHTML = `<span id="sound-icon">🔊</span> Sound: ON`;
                btn.classList.remove('btn-subtle');
                btn.classList.add('btn-teal');
            } else {
                btn.innerHTML = `<span id="sound-icon">🔇</span> Sound: OFF`;
                btn.classList.remove('btn-teal');
                btn.classList.add('btn-subtle');
            }
        }
    </script>

    <!-- ==========================================================================
         MOTION GRAPHICS ANIMATION ENGINE (AFTER EFFECTS FLUIDITY)
         ========================================================================== -->
    <script>
        const actor = document.getElementById('motion-actor');
        const actorFill = document.getElementById('actor-fill');
        const actorSheen = document.getElementById('actor-sheen');
        const shadow = document.getElementById('ground-shadow');
        const shockwave = document.getElementById('shockwave');
        const letters = Array.from(document.querySelectorAll('.logo-letter'));
        const loreDiamond = document.getElementById('lore-diamond');
        const particlesContainer = document.getElementById('particles-container');

        let speedMultiplier = 1.0;
        let animationTimeouts = [];
        let isAnimating = false;

        // Cubic bezier easing curves
        const easeOutQuad = t => t * (2 - t);
        const easeOutBounce = t => {
            if (t < (1 / 2.75)) return 7.5625 * t * t;
            if (t < (2 / 2.75)) return 7.5625 * (t -= (1.5 / 2.75)) * t + 0.75;
            if (t < (2.5 / 2.75)) return 7.5625 * (t -= (2.25 / 2.75)) * t + 0.9375;
            return 7.5625 * (t -= (2.625 / 2.75)) * t + 0.984375;
        };

        function setSpeed(speed, btnElement) {
            speedMultiplier = speed;
            document.querySelectorAll('.speed-badge').forEach(b => b.classList.remove('selected'));
            if (btnElement) btnElement.classList.add('selected');
            triggerReplay();
        }

        function setPhaseDot(activeDotId) {
            ['dot-1', 'dot-2', 'dot-3', 'dot-4', 'dot-5'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id === activeDotId);
            });
        }

        function createShockwave(scale = 2.4) {
            const wave = shockwave.cloneNode(true);
            shockwave.parentNode.appendChild(wave);
            wave.style.opacity = '1';
            wave.style.transition = `transform ${0.35 / speedMultiplier}s cubic-bezier(0.1, 0.9, 0.2, 1), opacity ${0.35 / speedMultiplier}s ease-out`;
            requestAnimationFrame(() => {
                wave.style.transform = `translate(-50%, -50%) scale(${scale})`;
                wave.style.opacity = '0';
            });
            setTimeout(() => wave.remove(), (400 / speedMultiplier));
        }

        function spawnDustParticles(count = 8) {
            particlesContainer.innerHTML = '';
            const stageRect = document.getElementById('stage').getBoundingClientRect();
            const centerX = stageRect.width / 2;
            const centerY = stageRect.height - 110;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'dust-particle';
                const size = Math.random() * 6 + 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';

                particlesContainer.appendChild(p);

                const angle = (Math.PI / (count - 1)) * i + Math.PI; // Fan across the floor
                const dist = Math.random() * 70 + 40;
                const destX = Math.cos(angle) * dist;
                const destY = Math.sin(angle) * (dist * 0.35); // Flattened ground ellipse

                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 0.9 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: (380 / speedMultiplier),
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                });
            }
        }

        function spawnBurstSparks(centerX, centerY) {
            const colors = ['#2ce5c6', '#ff47ab', '#ffd166', '#9d7bff'];
            for (let i = 0; i < 8; i++) {
                const spark = document.createElement('div');
                spark.className = 'cross-spark';
                spark.style.left = (centerX - 7) + 'px';
                spark.style.top = (centerY - 7) + 'px';
                particlesContainer.appendChild(spark);

                const angle = (i / 8) * (Math.PI * 2);
                const distance = Math.random() * 65 + 45;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;

                spark.animate([
                    { transform: 'translate(0, 0) scale(0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${targetX * 0.6}px, ${targetY * 0.6}px) scale(1.3) rotate(${angle * 30}deg)`, opacity: 1, offset: 0.5 },
                    { transform: `translate(${targetX}px, ${targetY}px) scale(0) rotate(${angle * 90}deg)`, opacity: 0 }
                ], {
                    duration: (420 / speedMultiplier),
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'forwards'
                });
            }
        }

        function resetAll() {
            animationTimeouts.forEach(t => clearTimeout(t));
            animationTimeouts = [];

            actor.style.transition = 'none';
            actor.style.transform = 'translate(-50%, 0) translateY(-600px)';
            actor.style.width = '54px';
            actor.style.height = '54px';
            actor.style.borderRadius = '50%';
            actor.style.backgroundColor = '#000000';
            actor.style.borderColor = '#000000';
            actor.style.boxShadow = '0px 0px 0px transparent';

            actorFill.style.transition = 'none';
            actorFill.style.opacity = '0';
            actorFill.style.transform = 'scale(0)';

            actorSheen.style.transition = 'none';
            actorSheen.style.transform = 'translateX(-160%)';

            shadow.style.transition = 'none';
            shadow.style.opacity = '0';
            shadow.style.width = '30px';
            shadow.style.filter = 'blur(10px)';

            letters.forEach(letter => {
                letter.style.transition = 'none';
                letter.style.opacity = '0';
                letter.style.transform = 'translateY(-50px) scale(0.2) rotate(-15deg)';
            });

            loreDiamond.style.transition = 'none';
            loreDiamond.style.opacity = '0';
            loreDiamond.style.transform = 'rotate(45deg) scale(0)';

            particlesContainer.innerHTML = '';
            setPhaseDot(null);
        }

        function runMotionTimeline() {
            resetAll();
            isAnimating = true;

            const t = (ms) => ms / speedMultiplier;
            const queue = (fn, delayMs) => {
                const timeoutId = setTimeout(fn, t(delayMs));
                animationTimeouts.push(timeoutId);
            };

            // Force reflow
            void actor.offsetWidth;

            // ==================================================================
            // PHASE 1: PIXAR-STYLE 3D BOUNCING DOT
            // ==================================================================
            setPhaseDot('dot-1');

            // 1. Initial Drop from High Above
            actor.style.transition = `transform ${t(420)}ms cubic-bezier(0.55, 0.055, 0.675, 0.19)`;
            actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(0.85, 1.25)';

            shadow.style.transition = `opacity ${t(420)}ms ease-in, width ${t(420)}ms ease-in, filter ${t(420)}ms ease-in`;
            shadow.style.opacity = '0.45';
            shadow.style.width = '70px';
            shadow.style.filter = 'blur(3px)';

            // Bounce 1: Big Impact Squash
            queue(() => {
                sound.playBounce(1.0, 0.42);
                createShockwave(2.6);
                spawnDustParticles(10);

                actor.style.transition = `transform ${t(110)}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(1.55, 0.52)';

                shadow.style.width = '95px';
                shadow.style.opacity = '0.55';
            }, 420);

            // Rebound 1: High Arc into Air
            queue(() => {
                actor.style.transition = `transform ${t(380)}ms cubic-bezier(0.215, 0.61, 0.355, 1)`;
                actor.style.transform = 'translate(-50%, 0) translateY(-170px) scale(0.9, 1.2)';

                shadow.style.transition = `opacity ${t(380)}ms ease-out, width ${t(380)}ms ease-out, filter ${t(380)}ms ease-out`;
                shadow.style.opacity = '0.15';
                shadow.style.width = '35px';
                shadow.style.filter = 'blur(8px)';
            }, 530);

            // Fall 2: Coming down to ground
            queue(() => {
                actor.style.transition = `transform ${t(320)}ms cubic-bezier(0.55, 0.055, 0.675, 0.19)`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(0.95, 1.1)';

                shadow.style.transition = `opacity ${t(320)}ms ease-in, width ${t(320)}ms ease-in, filter ${t(320)}ms ease-in`;
                shadow.style.opacity = '0.45';
                shadow.style.width = '65px';
                shadow.style.filter = 'blur(3px)';
            }, 910);

            // Bounce 2: Medium Squash
            queue(() => {
                sound.playBounce(1.35, 0.3);
                createShockwave(1.8);
                spawnDustParticles(6);

                actor.style.transition = `transform ${t(90)}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(1.3, 0.72)';

                shadow.style.width = '80px';
                shadow.style.opacity = '0.5';
            }, 1230);

            // Rebound 2: Small Hop
            queue(() => {
                actor.style.transition = `transform ${t(220)}ms cubic-bezier(0.215, 0.61, 0.355, 1)`;
                actor.style.transform = 'translate(-50%, 0) translateY(-55px) scale(0.98, 1.05)';

                shadow.style.transition = `opacity ${t(220)}ms ease-out, width ${t(220)}ms ease-out`;
                shadow.style.opacity = '0.25';
                shadow.style.width = '48px';
            }, 1320);

            // Settle to Ground Center
            queue(() => {
                actor.style.transition = `transform ${t(180)}ms cubic-bezier(0.55, 0.055, 0.675, 0.19)`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(1.12, 0.88)';

                shadow.style.opacity = '0.45';
                shadow.style.width = '60px';
            }, 1540);

            queue(() => {
                actor.style.transition = `transform ${t(140)}ms cubic-bezier(0.175, 0.885, 0.32, 1.275)`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(1, 1)';
            }, 1720);

            // ==================================================================
            // PHASE 2: MORPH CIRCLE -> RECTANGLE (ELASTIC OVERSHOOT)
            // ==================================================================
            queue(() => {
                setPhaseDot('dot-2');
                // Anticipation pre-stretch
                actor.style.transition = `transform ${t(120)}ms ease-in`;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(0.85, 1.15)';
            }, 1900);

            queue(() => {
                sound.playMorph();

                // Snappy expansion from 54px circle to 380px rectangle!
                actor.style.transition = `
                    width ${t(260)}ms cubic-bezier(0.34, 1.56, 0.64, 1),
                    height ${t(260)}ms cubic-bezier(0.34, 1.56, 0.64, 1),
                    border-radius ${t(220)}ms ease-out,
                    transform ${t(260)}ms cubic-bezier(0.34, 1.56, 0.64, 1),
                    background-color ${t(150)}ms ease-out
                `;

                actor.style.width = '380px';
                actor.style.height = '105px';
                actor.style.borderRadius = '18px';
                actor.style.backgroundColor = '#ffffff';
                actor.style.transform = 'translate(-50%, 0) translateY(0px) scale(1, 1)';

                shadow.style.transition = `width ${t(260)}ms cubic-bezier(0.34, 1.56, 0.64, 1), height ${t(260)}ms ease`;
                shadow.style.width = '360px';
                shadow.style.height = '28px';
                shadow.style.borderRadius = '18px';
                shadow.style.opacity = '0.35';
            }, 2020);

            // ==================================================================
            // PHASE 3: COLOR FILL EXPLOSION (PRESERVING BLACK BORDER)
            // ==================================================================
            queue(() => {
                setPhaseDot('dot-3');
                sound.playColorFill();

                actorFill.style.transition = `opacity ${t(180)}ms ease-out, transform ${t(240)}ms cubic-bezier(0.22, 1, 0.36, 1)`;
                actorFill.style.opacity = '1';
                actorFill.style.transform = 'scale(1)';
            }, 2320);

            // ==================================================================
            // PHASE 4: POP OUT THE HARD SOLID BLACK SHADOW (NEO-BRUTALIST THWACK)
            // ==================================================================
            queue(() => {
                setPhaseDot('dot-4');

                // Anticipation: slight lift
                actor.style.transition = `transform ${t(100)}ms ease-out`;
                actor.style.transform = 'translate(-50%, 0) translateY(-6px) translate(-3px, -3px)';
            }, 2580);

            queue(() => {
                sound.playShadowPop();

                // BAM! Hard shadow pops out!
                actor.style.transition = `
                    transform ${t(140)}ms cubic-bezier(0.175, 0.885, 0.32, 1.275),
                    box-shadow ${t(120)}ms cubic-bezier(0.175, 0.885, 0.32, 1.275)
                `;
                actor.style.transform = 'translate(-50%, 0) translateY(0px) translate(-5px, -5px)';
                actor.style.boxShadow = '10px 10px 0px #000000';

                // Spawn burst sparks around the box corners
                const actorRect = actor.getBoundingClientRect();
                spawnBurstSparks(actorRect.left + 20, actorRect.top + 20);
                spawnBurstSparks(actorRect.right - 20, actorRect.top + 20);
                spawnBurstSparks(actorRect.left + 20, actorRect.bottom - 20);
                spawnBurstSparks(actorRect.right - 20, actorRect.bottom - 20);
            }, 2680);

            // ==================================================================
            // PHASE 5: THE WORD "LOREDLE" ANIMATES IN LETTER-BY-LETTER
            // ==================================================================
            queue(() => {
                setPhaseDot('dot-5');
                const letterDelay = 75;

                letters.forEach((letter, i) => {
                    queue(() => {
                        sound.playLetterStamp(i);

                        letter.style.transition = `
                            transform ${t(220)}ms cubic-bezier(0.175, 0.885, 0.32, 1.45),
                            opacity ${t(140)}ms ease-out
                        `;
                        letter.style.opacity = '1';
                        letter.style.transform = 'translateY(0) scale(1) rotate(0deg)';
                    }, i * letterDelay);
                });
            }, 2900);

            // ==================================================================
            // PHASE 6: LORE DIAMOND POP & HOLOGRAPHIC SHEEN FINISH
            // ==================================================================
            queue(() => {
                sound.playShimmer();

                // Lore Diamond pops on top-right
                loreDiamond.style.transition = `
                    transform ${t(280)}ms cubic-bezier(0.175, 0.885, 0.32, 1.45),
                    opacity ${t(160)}ms ease-out
                `;
                loreDiamond.style.opacity = '1';
                loreDiamond.style.transform = 'rotate(45deg) scale(1)';

                // Light sheen sweeps across the badge
                actorSheen.style.transition = `transform ${t(600)}ms cubic-bezier(0.22, 1, 0.36, 1)`;
                actorSheen.style.transform = 'translateX(160%)';
            }, 3500);

            // ==================================================================
            // PHASE 7: IDLE FLOAT & SETTLE
            // ==================================================================
            queue(() => {
                actor.style.transition = `transform ${t(1800)}ms ease-in-out`;
                actor.style.animation = 'gentleFloat 3.2s infinite ease-in-out alternate';
                isAnimating = false;
            }, 4100);
        }

        function triggerReplay() {
            const icon = document.getElementById('replay-icon');
            if (icon) {
                icon.style.transform = 'rotate(360deg)';
                icon.style.transition = 'transform 0.3s ease';
                setTimeout(() => { icon.style.transform = 'none'; }, 300);
            }
            sound.init();
            runMotionTimeline();
        }

        // Cycle through color themes
        const themes = ['theme-paper', 'theme-dark', 'theme-mint'];
        let currentThemeIndex = 0;

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            document.body.className = theme === 'theme-paper' ? '' : theme;

            const btn = document.getElementById('btn-theme');
            if (theme === 'theme-paper') btn.textContent = '🌓 Theme: Paper';
            else if (theme === 'theme-dark') btn.textContent = '🌓 Theme: Dark';
            else if (theme === 'theme-mint') btn.textContent = '🌓 Theme: Mint';
        }

        // Gentle floating keyframe for idle state
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes gentleFloat {
                0% { transform: translate(-50%, 0) translateY(0px) translate(-5px, -5px); }
                100% { transform: translate(-50%, 0) translateY(-6px) translate(-5px, -5px); }
            }
        `;
        document.head.appendChild(styleSheet);

        // Auto-start on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runMotionTimeline, 300);
        });

        // Initialize sound context on first user click anywhere
        document.addEventListener('pointerdown', () => {
            sound.init();
        }, { once: true });
    </script>
</body>
</html>
