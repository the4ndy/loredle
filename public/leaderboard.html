<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loredle — Daily Leaderboard</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8C76E2T1CC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-8C76E2T1CC');
    </script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand" onclick="window.location.href='index.html'">Loredle</div>
        <div id="nav-auth-container" class="nav-auth"></div>
    </nav>

    <div id="nav-dropdown" class="nav-dropdown"></div>

    <div class="menu-container" style="max-width: 620px;">
        <h2 style="color: var(--secondary-color); margin-top: 0; font-size: 2rem; text-shadow: 2px 2px 0px #000;">Today's Leaderboard</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Ranked by fewest tries to solve today's Loredle.</p>

        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Tries</th>
                </tr>
            </thead>
            <tbody id="global-leaderboard-body">
                <tr>
                    <td colspan="3" style="color: var(--text-secondary);">Loading scores...</td>
                </tr>
            </tbody>
        </table>

        <div style="margin-top: 28px;">
            <button onclick="location.href='/index.html'" class="btn secondary-btn">← Back to Hub</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchGlobalLeaderboard();
        });
    </script>
</body>

</html>
